map $uri $address_book_app_key {
    ~^/address-book/static/ "";
    default $binary_remote_addr;
}

map $uri $address_book_static_key {
    ~^/address-book/static/ $binary_remote_addr;
    default "";
}

limit_req_zone $address_book_app_key zone=address_book_app:1m rate=8r/s;
limit_req_zone $address_book_static_key zone=address_book_static:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=address_book_connections:1m;
