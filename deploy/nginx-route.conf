location = /address-book {
    return 308 /address-book/$is_args$args;
}

location /address-book/ {
    limit_req zone=address_book_app burst=24 nodelay;
    limit_req zone=address_book_static burst=40 nodelay;
    limit_req_status 429;
    limit_conn address_book_connections 8;
    limit_conn_status 429;

    auth_basic off;

    client_max_body_size 6m;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 12s;
    proxy_read_timeout 24s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $server_name;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_pass http://127.0.0.1:3002;
}
