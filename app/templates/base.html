<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3157d5">
    <title>{% block title %}Address Book{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ambient-background.css') }}">
    <script src="{{ url_for('static', filename='ambient-background.js') }}" defer></script>
</head>
<body>
    {% include "ambient_background.html" %}
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="{{ url_for('contacts.index') }}">
                <span class="brand-mark" aria-hidden="true">AB</span>
                <span>Address Book</span>
            </a>
            <a class="button button-primary" href="{{ url_for('contacts.create') }}">Add contact</a>
        </div>
    </header>

    <main class="container main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages" aria-live="polite" role="status">
                    {% for category, message in messages %}
                        <div class="message message-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
