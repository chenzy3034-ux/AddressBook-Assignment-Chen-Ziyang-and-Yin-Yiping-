{% extends "base.html" %}

{% block title %}{{ page_title }} | Address Book{% endblock %}

{% block content %}
<div class="narrow-page form-page">
    <a class="back-link" href="{{ url_for('contacts.index') }}">&larr; Back to contacts</a>
    <div class="panel">
        <h1>{{ page_title }}</h1>
        <p class="form-note">A name and at least one contact method are required.</p>

        <form method="post" class="contact-form">
            <label for="name">Name <span aria-hidden="true">*</span></label>
            <input id="name" name="name" type="text" maxlength="120" value="{{ contact['name'] }}" required autofocus>

            <div class="method-heading">
                <h2>Contact methods</h2>
                <button class="button button-secondary" id="add-method" type="button">Add method</button>
            </div>

            <div class="method-list" id="contact-methods">
                {% for method in methods %}
                    <div class="method-row">
                        <label>
                            <span>Type</span>
                            <select name="method_type">
                                {% for method_type, title in method_types.items() %}
                                    <option value="{{ method_type }}"{% if method['method_type'] == method_type %} selected{% endif %}>{{ title }}</option>
                                {% endfor %}
                            </select>
                        </label>
                        <label>
                            <span>Label</span>
                            <input name="method_label" type="text" maxlength="50" value="{{ method['label'] }}" placeholder="Mobile, work, personal">
                        </label>
                        <label class="method-value-field">
                            <span>Value</span>
                            <input name="method_value" type="text" maxlength="500" value="{{ method['value'] }}" placeholder="Phone, email, username, or address">
                        </label>
                        <button class="remove-method" type="button" aria-label="Remove contact method">Remove</button>
                    </div>
                {% endfor %}
            </div>

            <div class="form-actions">
                <button class="button button-primary" type="submit">Save contact</button>
                <a class="button button-secondary" href="{{ url_for('contacts.index') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>

<template id="contact-method-template">
    <div class="method-row">
        <label>
            <span>Type</span>
            <select name="method_type">
                {% for method_type, title in method_types.items() %}
                    <option value="{{ method_type }}">{{ title }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            <span>Label</span>
            <input name="method_label" type="text" maxlength="50" placeholder="Mobile, work, personal">
        </label>
        <label class="method-value-field">
            <span>Value</span>
            <input name="method_value" type="text" maxlength="500" placeholder="Phone, email, username, or address">
        </label>
        <button class="remove-method" type="button" aria-label="Remove contact method">Remove</button>
    </div>
</template>

<script src="{{ url_for('static', filename='contact_methods.js') }}" defer></script>
{% endblock %}
